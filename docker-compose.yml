name: nexo

# Entorno LOCAL de pruebas. Sustituye los servicios gestionados de AWS por equivalentes locales:
#   Neon (Postgres)  -> postgres
#   Amazon MSK/Kafka -> redpanda (API Kafka + schema registry)
#   Amazon S3        -> minio
#   OTLP/observabilidad -> jaeger
#
# Uso:
#   docker compose up -d                 # levanta la infra (postgres, redpanda, console, minio, jaeger)
#   docker compose --profile app up -d   # además compila y levanta la Production.Api
#
# Consolas:  Redpanda http://localhost:8080 · MinIO http://localhost:9001 · Jaeger http://localhost:16686

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      POSTGRES_DB: nexo_controlplane
    ports:
      # 5433 en el HOST -> 5432 en el contenedor.
      # Se usa 5433 a propósito: el 5432 suele estar ocupado por un PostgreSQL nativo instalado
      # en la máquina, y en ese caso "localhost:5432" iría al Postgres equivocado.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nexo]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"    # Kafka (desde el host)
      - "8081:8081"    # Schema Registry
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [nexo]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    networks: [nexo]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexo12345}
    ports:
      - "9000:9000"    # API S3
      - "9001:9001"    # Consola
    volumes:
      - miniodata:/data
    networks: [nexo]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks: [nexo]

  # --- Servicios de aplicación (opcionales; profile "app") ---
  production-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Services/Nexo.Production/Nexo.Production.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      Kafka__BootstrapServers: redpanda:29092
      # Tenant demo (resolver local por configuración — ver ConfigurationTenantConnectionResolver)
      Tenants__0__Key: demo
      Tenants__0__TenantId: 00000000-0000-0000-0000-0000000000d1
      Tenants__0__SchemaVersion: "1"
      Tenants__0__ConnectionString: "Host=postgres;Port=5432;Database=nexo_tenant_demo;Username=${POSTGRES_USER:-nexo};Password=${POSTGRES_PASSWORD:-nexo}"
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [nexo]

volumes:
  pgdata:
  rpdata:
  miniodata:

networks:
  nexo:
    driver: bridge
