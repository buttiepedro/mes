name: nexo-cloud

# ☁️ PLANO NUBE del MES — se despliega UNA sola vez, es multi-tenant, y se comunica con HEXA.
# Recibe las observaciones de todos los edges (HTTPS → ingesta → Kafka interna), corre el motor de
# reglas, y entrega los eventos a HEXA.
#
# En producción, la infra (Postgres, Kafka, S3) son servicios GESTIONADOS (Neon / Amazon MSK / S3);
# acá se incluyen equivalentes locales para desarrollo. Las apps van bajo el profile "app".
#
# Uso:
#   docker compose -f docker-compose.cloud.yml up -d                 # solo infra (dev)
#   docker compose -f docker-compose.cloud.yml --profile app up -d   # infra + servicios cloud
#
# Consolas: Redpanda http://localhost:8080 · MinIO http://localhost:9001 · Jaeger http://localhost:16686

services:
  # ---------- Infraestructura (dev; en prod: managed) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      POSTGRES_DB: nexo_controlplane
    ports:
      - "5433:5432"   # 5433 en el host a propósito (evita chocar con un Postgres nativo en 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [nexo]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"
      - "8081:8081"
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [nexo]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ["8080:8080"]
    depends_on: [redpanda]
    networks: [nexo]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexo12345}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    networks: [nexo]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    networks: [nexo]

  # ---------- Servicios cloud del MES (profile "app"; WIP — se construyen en V-A..V-D) ----------
  mes-api:
    profiles: ["app"]
    build: { context: ., dockerfile: src/cloud/Nexo.MesApi/Dockerfile }
    # Config (planta/cámaras/dispositivos/catálogos/reglas) + tablero embebible + BFF + INGESTA de
    # observaciones del edge (HTTPS → Kafka). Valida el JWT de HEXA (HEXA es el IdP).
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kafka__BootstrapServers: redpanda:29092
      Hexa__JwtSecret: ${HEXA_JWT_SECRET:-change-me-to-a-long-random-string}
    ports: ["5084:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
    networks: [nexo]

  rules-engine:
    profiles: ["app"]
    build: { context: ., dockerfile: src/cloud/Nexo.RulesEngine/Dockerfile }
    # Consume observaciones (visión + señal), evalúa reglas, emite Eventos canónicos.
    environment:
      Kafka__BootstrapServers: redpanda:29092
    depends_on:
      redpanda: { condition: service_started }
    networks: [nexo]

  event-gateway:
    profiles: ["app"]
    build: { context: ., dockerfile: src/cloud/Nexo.EventGateway/Dockerfile }
    # Consume Eventos canónicos y los entrega a HEXA (webhooks firmados + API de lectura).
    environment:
      Kafka__BootstrapServers: redpanda:29092
      Hexa__BaseUrl: ${HEXA_BASE_URL:-http://host.docker.internal:8000}
    depends_on:
      redpanda: { condition: service_started }
    networks: [nexo]

volumes:
  pgdata:
  rpdata:
  miniodata:

networks:
  nexo:
    driver: bridge
